name: Build macOS Application

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v2.0.0)'
        required: true
        type: string

jobs:
  build-macos-arm64:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements-macos.txt
          pip install pyinstaller

      # Import Apple signing certificate into a temporary keychain
      # This step is skipped if APPLE_CERTIFICATE is not set (unsigned build)
      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set, skipping certificate import (unsigned build)"
            exit 0
          fi

          # Create a temporary keychain for signing
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          # Create and configure the keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode and import the certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"

          # Allow codesign to access the keychain without prompting
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add keychain to the search list
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Verify the certificate was imported
          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # Setup App Store Connect API key for notarization
      - name: Setup notarization credentials
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_API_KEY_CONTENT" ]; then
            echo "APPLE_API_KEY_CONTENT not set, skipping notarization setup"
            exit 0
          fi

          # Create the private_keys directory where notarytool looks for keys
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_CONTENT" > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8
          chmod 600 ~/private_keys/AuthKey_${APPLE_API_KEY}.p8

      - name: Build app bundle with PyInstaller
        run: |
          cd build/macos
          pyinstaller build.spec --clean --noconfirm

      - name: Verify build
        id: verify
        run: |
          if [ -d "build/macos/dist/MeshtasticBLEBridge.app" ]; then
            SIZE=$(du -sh "build/macos/dist/MeshtasticBLEBridge.app" | cut -f1)
            echo "Build successful"
            echo "Size: $SIZE"
            echo "size=$SIZE" >> $GITHUB_OUTPUT
          else
            echo "Build failed - app bundle not found"
            exit 1
          fi

      # Sign all binaries in the app bundle
      - name: Sign application
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY not set, skipping signing"
            exit 0
          fi

          APP_PATH="build/macos/dist/MeshtasticBLEBridge.app"
          ENTITLEMENTS="build/macos/entitlements.plist"

          echo "Signing with identity: $APPLE_SIGNING_IDENTITY"

          # Sign all dylibs and .so files in Frameworks
          echo "Signing libraries in Frameworks..."
          find "$APP_PATH/Contents/Frameworks" \( -name "*.dylib" -o -name "*.so" \) -type f 2>/dev/null | while read -r lib; do
            echo "Signing: $lib"
            codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" \
              --entitlements "$ENTITLEMENTS" --timestamp "$lib" || true
          done

          # Sign any Mach-O binaries in Frameworks
          find "$APP_PATH/Contents/Frameworks" -type f -perm -u+x 2>/dev/null | while read -r file; do
            if file "$file" | grep -q "Mach-O"; then
              echo "Signing Mach-O: $file"
              codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" \
                --entitlements "$ENTITLEMENTS" --timestamp "$file" || true
            fi
          done

          # Sign the main executable
          echo "Signing main executable..."
          codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" --timestamp \
            "$APP_PATH/Contents/MacOS/MeshtasticBLEBridge"

          # Sign the app bundle
          echo "Signing app bundle..."
          codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" --timestamp "$APP_PATH"

          # Verify signature
          echo "Verifying signature..."
          codesign --verify --verbose=2 "$APP_PATH"
          echo "Signature verification passed"

      - name: Get version from tag
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      # Create DMG from the signed app
      - name: Create DMG
        id: create_dmg
        run: |
          APP_PATH="build/macos/dist/MeshtasticBLEBridge.app"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          DMG_NAME="MeshtasticBLEBridge-macOS-${VERSION}-arm64.dmg"
          DMG_PATH="build/macos/dist/$DMG_NAME"

          echo "Creating DMG..."
          mkdir -p dmg_temp
          cp -R "$APP_PATH" dmg_temp/
          ln -s /Applications dmg_temp/Applications

          hdiutil create -volname "Meshtastic BLE Bridge" \
            -srcfolder dmg_temp \
            -ov -format UDZO "$DMG_PATH"

          rm -rf dmg_temp

          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_OUTPUT
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_OUTPUT

      # Sign the DMG
      - name: Sign DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY not set, skipping DMG signing"
            exit 0
          fi

          codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp "${{ steps.create_dmg.outputs.DMG_PATH }}"

      # Notarize the DMG
      - name: Notarize DMG
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_API_KEY" ]; then
            echo "APPLE_API_KEY not set, skipping notarization"
            exit 0
          fi

          DMG_PATH="${{ steps.create_dmg.outputs.DMG_PATH }}"
          echo "Notarizing $DMG_PATH..."

          xcrun notarytool submit "$DMG_PATH" \
            --key ~/private_keys/AuthKey_${APPLE_API_KEY}.p8 \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG_PATH"

      - name: Generate checksums
        id: checksums
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          CHECKSUM_FILE="MeshtasticBLEBridge-macOS-${VERSION}-arm64.sha256"
          DMG_PATH="${{ steps.create_dmg.outputs.DMG_PATH }}"

          if [ -f "$DMG_PATH" ]; then
            HASH=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
            echo "$HASH  ${{ steps.create_dmg.outputs.DMG_NAME }}" > "$CHECKSUM_FILE"
          fi

          echo "CHECKSUM_FILE=$CHECKSUM_FILE" >> $GITHUB_OUTPUT

      - name: Upload DMG to release
        if: steps.create_dmg.outputs.DMG_PATH
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          files: ${{ steps.create_dmg.outputs.DMG_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          files: ${{ steps.checksums.outputs.CHECKSUM_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact for debugging
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: ${{ steps.create_dmg.outputs.DMG_PATH }}
          retention-days: 30

      - name: Summary
        run: |
          echo "## macOS ARM64 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** ${{ steps.verify.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** arm64 (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "- **Python:** 3.11" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "- **Code Signed:** Yes" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Code Signed:** No (certificate not provided)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${{ secrets.APPLE_API_KEY }}" ]; then
            echo "- **Notarized:** Yes" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Notarized:** No (credentials not provided)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build completed successfully" >> $GITHUB_STEP_SUMMARY

  build-macos-x64:
    name: Build macOS (Intel)
    runs-on: macos-13  # Use macos-13 for Intel builds
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements-macos.txt
          pip install pyinstaller

      # Import Apple signing certificate into a temporary keychain
      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set, skipping certificate import (unsigned build)"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Setup notarization credentials
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_API_KEY_CONTENT" ]; then
            echo "APPLE_API_KEY_CONTENT not set, skipping notarization setup"
            exit 0
          fi

          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_CONTENT" > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8
          chmod 600 ~/private_keys/AuthKey_${APPLE_API_KEY}.p8

      - name: Build app bundle with PyInstaller
        run: |
          cd build/macos
          pyinstaller build.spec --clean --noconfirm

      - name: Verify build
        id: verify
        run: |
          if [ -d "build/macos/dist/MeshtasticBLEBridge.app" ]; then
            SIZE=$(du -sh "build/macos/dist/MeshtasticBLEBridge.app" | cut -f1)
            echo "Build successful"
            echo "Size: $SIZE"
            echo "size=$SIZE" >> $GITHUB_OUTPUT
          else
            echo "Build failed - app bundle not found"
            exit 1
          fi

      - name: Sign application
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY not set, skipping signing"
            exit 0
          fi

          APP_PATH="build/macos/dist/MeshtasticBLEBridge.app"
          ENTITLEMENTS="build/macos/entitlements.plist"

          echo "Signing with identity: $APPLE_SIGNING_IDENTITY"

          find "$APP_PATH/Contents/Frameworks" \( -name "*.dylib" -o -name "*.so" \) -type f 2>/dev/null | while read -r lib; do
            echo "Signing: $lib"
            codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" \
              --entitlements "$ENTITLEMENTS" --timestamp "$lib" || true
          done

          find "$APP_PATH/Contents/Frameworks" -type f -perm -u+x 2>/dev/null | while read -r file; do
            if file "$file" | grep -q "Mach-O"; then
              echo "Signing Mach-O: $file"
              codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" \
                --entitlements "$ENTITLEMENTS" --timestamp "$file" || true
            fi
          done

          codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" --timestamp \
            "$APP_PATH/Contents/MacOS/MeshtasticBLEBridge"

          codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" --timestamp "$APP_PATH"

          codesign --verify --verbose=2 "$APP_PATH"
          echo "Signature verification passed"

      - name: Get version from tag
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Create DMG
        id: create_dmg
        run: |
          APP_PATH="build/macos/dist/MeshtasticBLEBridge.app"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          DMG_NAME="MeshtasticBLEBridge-macOS-${VERSION}-x64.dmg"
          DMG_PATH="build/macos/dist/$DMG_NAME"

          mkdir -p dmg_temp
          cp -R "$APP_PATH" dmg_temp/
          ln -s /Applications dmg_temp/Applications

          hdiutil create -volname "Meshtastic BLE Bridge" \
            -srcfolder dmg_temp \
            -ov -format UDZO "$DMG_PATH"

          rm -rf dmg_temp

          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_OUTPUT
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_OUTPUT

      - name: Sign DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Skipping DMG signing"
            exit 0
          fi

          codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp "${{ steps.create_dmg.outputs.DMG_PATH }}"

      - name: Notarize DMG
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_API_KEY" ]; then
            echo "Skipping notarization"
            exit 0
          fi

          DMG_PATH="${{ steps.create_dmg.outputs.DMG_PATH }}"
          echo "Notarizing $DMG_PATH..."

          xcrun notarytool submit "$DMG_PATH" \
            --key ~/private_keys/AuthKey_${APPLE_API_KEY}.p8 \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          xcrun stapler staple "$DMG_PATH"

      - name: Generate checksums
        id: checksums
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          CHECKSUM_FILE="MeshtasticBLEBridge-macOS-${VERSION}-x64.sha256"
          DMG_PATH="${{ steps.create_dmg.outputs.DMG_PATH }}"

          if [ -f "$DMG_PATH" ]; then
            HASH=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
            echo "$HASH  ${{ steps.create_dmg.outputs.DMG_NAME }}" > "$CHECKSUM_FILE"
          fi

          echo "CHECKSUM_FILE=$CHECKSUM_FILE" >> $GITHUB_OUTPUT

      - name: Upload DMG to release
        if: steps.create_dmg.outputs.DMG_PATH
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          files: ${{ steps.create_dmg.outputs.DMG_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          files: ${{ steps.checksums.outputs.CHECKSUM_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact for debugging
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-release
          path: ${{ steps.create_dmg.outputs.DMG_PATH }}
          retention-days: 30

      - name: Summary
        run: |
          echo "## macOS x64 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** ${{ steps.verify.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** x64 (Intel)" >> $GITHUB_STEP_SUMMARY
          echo "- **Python:** 3.11" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "- **Code Signed:** Yes" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Code Signed:** No" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${{ secrets.APPLE_API_KEY }}" ]; then
            echo "- **Notarized:** Yes" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Notarized:** No" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build completed successfully" >> $GITHUB_STEP_SUMMARY
