name: Run Tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  test-core:
    name: Test Core (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install -r src/requirements-test.txt

      - name: Run tests
        run: |
          cd src
          python -m pytest -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        run: |
          cd src
          python -m pytest --cov=core --cov-report=term --cov-report=xml

      - name: Upload coverage reports
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./src/coverage.xml
          flags: unittests
          name: codecov-core
        continue-on-error: true

  test-cli-imports:
    name: Test CLI Imports (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r src/requirements.txt

      - name: Test CLI imports
        run: |
          cd src
          python -c "from cli.main import main; print('✅ CLI imports OK')"

      - name: Test CLI help
        run: |
          cd src
          python -m cli.main --help

  test-gui-imports:
    name: Test GUI Imports (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install GUI dependencies
        run: |
          pip install -r src/requirements-gui.txt

      - name: Test GUI imports
        run: |
          cd src
          python -c "from gui.settings_dialog import SettingsDialog; print('Settings dialog imports OK')"
          python -c "import sys; sys.path.insert(0, '.'); from gui import main; print('GUI main imports OK')"

  docker-build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          load: true
          tags: meshtastic-ble-bridge:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm meshtastic-ble-bridge:test --help
